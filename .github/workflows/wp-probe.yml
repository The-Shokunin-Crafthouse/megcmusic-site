# Sprint 11 Phase 0 — empirical WP REST reachability probe from the GHA runner.
# Temporary: exists only on the sprint-11-wp-editability branch to answer the
# contract §3 network-context question. Removed before the Phase-0 PR merges
# or kept as a manual diagnostic (decided at the gate).
name: WP REST probe
on:
  push:
    branches: [sprint-11-wp-editability]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe admin.megcmusic.com from the runner
        run: |
          set +e
          echo "== GET /wp-json/ (root) =="
          curl -sS -m 20 -o /tmp/root.json -w "HTTP %{http_code}\n" https://admin.megcmusic.com/wp-json/
          head -c 200 /tmp/root.json; echo
          echo "== GET /wp-json/wp/v2/pages?per_page=1 =="
          curl -sS -m 20 -o /tmp/pages.json -w "HTTP %{http_code}\n" "https://admin.megcmusic.com/wp-json/wp/v2/pages?per_page=1&_fields=id,slug"
          head -c 200 /tmp/pages.json; echo
          echo "== GET /wp-json/tribe/events/v1/events?per_page=1 =="
          curl -sS -m 20 -o /tmp/events.json -w "HTTP %{http_code}\n" "https://admin.megcmusic.com/wp-json/tribe/events/v1/events?per_page=1"
          head -c 200 /tmp/events.json; echo
          echo "== POST /wp-json/wp/v2/pages unauthenticated (expect WP-core 401 JSON) =="
          curl -sS -m 20 -X POST -H "Content-Type: application/json" -d '{"title":"probe"}' -o /tmp/post.json -w "HTTP %{http_code}\n" https://admin.megcmusic.com/wp-json/wp/v2/pages
          head -c 300 /tmp/post.json; echo
          echo "== HEAD wp-content/uploads static file =="
          curl -sS -m 20 -o /dev/null -I -w "HTTP %{http_code}\n" "https://admin.megcmusic.com/wp-content/uploads/2025/07/5-1-1024x1024.png"
          exit 0
