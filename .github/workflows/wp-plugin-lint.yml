# Lints the WordPress plugin on every PR that touches it: PHP 8.3 syntax
# (the 2026-08-27 wp-admin outage class was PHP-incompatible plugin code
# fataling on admin hooks), the PHP unit tests, and field-group JSON validity.
# Also the gate wp-plugin-release.yml runs before it releases the plugin
# (workflow_call), so a release never ships what a PR would have failed.
name: WP plugin lint
on:
  pull_request:
    paths: ["wp-plugin/**"]
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
      - name: PHP syntax check (8.3)
        run: |
          set -e
          find wp-plugin -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Route-map unit tests
        run: php wp-plugin/megc-site-content/tests/live-routes.test.php
      - name: Shared-sections unit tests
        run: php wp-plugin/megc-site-content/tests/shared-sections.test.php
      - name: Self-update unit tests
        run: php wp-plugin/megc-site-content/tests/self-update.test.php
      - name: Field-group JSON validity
        run: |
          set -e
          for f in wp-plugin/megc-site-content/acf-json/*.json; do
            python3 -m json.tool "$f" > /dev/null && echo "OK $f"
          done
