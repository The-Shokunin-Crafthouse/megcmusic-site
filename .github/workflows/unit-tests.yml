# Unit tests (node:test via tsx) on every pull request. Added in Sprint 12
# with the first unit test in the repo — the video merge order — so the
# regression it fixes cannot come back unnoticed.
name: Unit tests
on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Page-layout field groups match the registry
        run: npm run layout:check
      # Dependency-free and fully stubbed; runs here rather than in its own job
      # because it needs nothing the test job has not already set up.
      - run: bash scripts/ci/test/vercel-deploy.test.sh

  # Every action in .github/workflows/ must be pinned to a commit SHA carrying
  # the release tag it belongs to. A pin nothing verifies is a to-do wearing a
  # guarantee's costume: this is the thing that verifies it. Its own job, so a
  # pin problem is legible on the PR rather than buried in the test job.
  action-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # No `npm ci` — the checker is dependency-free on purpose, so a broken
      # lockfile cannot stop the supply-chain check from running.
      - run: node scripts/ci/verify-action-pins.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
