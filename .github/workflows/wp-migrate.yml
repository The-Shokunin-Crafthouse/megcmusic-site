# Sprint 11 Phase 2 — content migration into WordPress ACF fields.
# Dry-run on pushes to the phase branch (auth + lookups, no writes);
# the real write is workflow_dispatch after review/merge. Runs here because
# the runner reaches admin.megcmusic.com and holds WP_APP_USER/WP_APP_PASSWORD.
name: WP content migration
on:
  push:
    branches: [sprint-11-phase-2-migration]
    paths: ["scripts/wp-migrate/**", ".github/workflows/wp-migrate.yml"]
  workflow_dispatch:
    inputs:
      write:
        description: "Set to 'write' to perform the real migration (anything else dry-runs)"
        default: "dry-run"

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Run migration
        env:
          WP_APP_USER: ${{ secrets.WP_APP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.write }}" = "write" ]; then
            node --import tsx scripts/wp-migrate/migrate-content.ts
          else
            node --import tsx scripts/wp-migrate/migrate-content.ts --dry-run
          fi
